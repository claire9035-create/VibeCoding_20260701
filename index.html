<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="選擇喜歡的犬種，隨機探索一張可愛狗狗圖片。">
    <title>汪汪圖鑑｜狗狗圖片搜尋</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #19324a;
            --blue: #2368a2;
            --blue-dark: #194f7d;
            --cream: #fff9ed;
            --white: #ffffff;
            --orange: #f2763b;
            --orange-dark: #cf5721;
            --muted: #607487;
            --border: #d9e5ec;
            --shadow: 0 18px 50px rgba(25, 50, 74, 0.13);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--navy);
            background:
                radial-gradient(circle at 8% 12%, rgba(242, 118, 59, 0.13) 0 6%, transparent 6.2%),
                radial-gradient(circle at 90% 85%, rgba(35, 104, 162, 0.12) 0 8%, transparent 8.2%),
                var(--cream);
            font-family: "Noto Sans TC", sans-serif;
            line-height: 1.6;
        }

        button,
        select {
            font: inherit;
        }

        button,
        select {
            min-height: 52px;
        }

        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: min(1120px, calc(100% - 40px));
            margin: 0 auto;
            padding: 28px 0 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: "Fredoka", "Noto Sans TC", sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .brand-mark {
            display: grid;
            width: 44px;
            height: 44px;
            place-items: center;
            color: var(--white);
            background: var(--blue);
            border: 2px solid var(--navy);
            border-radius: 14px;
            box-shadow: 3px 4px 0 var(--navy);
        }

        .brand-mark svg {
            width: 24px;
            height: 24px;
        }

        .api-label {
            padding: 6px 13px;
            color: var(--blue-dark);
            background: #e7f3fb;
            border: 1px solid #bed8e9;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        main {
            display: grid;
            grid-template-columns: minmax(0, 0.9fr) minmax(360px, 1.1fr);
            gap: 56px;
            align-items: center;
            width: min(1120px, calc(100% - 40px));
            min-height: calc(100vh - 112px);
            margin: 0 auto;
            padding: 44px 0 80px;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 18px;
            color: var(--orange-dark);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.12em;
        }

        .eyebrow::before {
            width: 24px;
            height: 3px;
            background: var(--orange);
            border-radius: 99px;
            content: "";
        }

        h1 {
            max-width: 560px;
            margin: 0;
            font-family: "Fredoka", "Noto Sans TC", sans-serif;
            font-size: clamp(2.75rem, 6vw, 5rem);
            line-height: 1.08;
            letter-spacing: -0.04em;
        }

        h1 span {
            color: var(--orange);
        }

        .intro {
            max-width: 520px;
            margin: 24px 0 32px;
            color: var(--muted);
            font-size: 1.05rem;
        }

        .search-panel {
            padding: 24px;
            background: rgba(255, 255, 255, 0.86);
            border: 2px solid var(--navy);
            border-radius: 24px;
            box-shadow: 7px 8px 0 var(--navy);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 700;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 12px;
        }

        select {
            width: 100%;
            padding: 0 44px 0 16px;
            color: var(--navy);
            background: var(--white);
            border: 2px solid var(--border);
            border-radius: 14px;
            cursor: pointer;
        }

        select:hover {
            border-color: #9dbccd;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0 22px;
            color: var(--white);
            background: var(--orange);
            border: 2px solid var(--navy);
            border-radius: 14px;
            box-shadow: 3px 4px 0 var(--navy);
            font-weight: 700;
            cursor: pointer;
            transition: background-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
        }

        button:hover:not(:disabled) {
            background: var(--orange-dark);
            transform: translateY(-2px);
            box-shadow: 4px 6px 0 var(--navy);
        }

        button:active:not(:disabled) {
            transform: translate(2px, 2px);
            box-shadow: 1px 2px 0 var(--navy);
        }

        button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        select:focus-visible,
        button:focus-visible {
            outline: 3px solid rgba(35, 104, 162, 0.35);
            outline-offset: 3px;
        }

        .button-icon {
            width: 19px;
            height: 19px;
        }

        .helper-text {
            margin: 14px 0 0;
            color: var(--muted);
            font-size: 0.82rem;
        }

        .result-card {
            position: relative;
            min-height: 540px;
            padding: 16px;
            overflow: hidden;
            background: var(--white);
            border: 2px solid var(--navy);
            border-radius: 32px;
            box-shadow: var(--shadow), 8px 10px 0 var(--blue);
        }

        .result-card::before,
        .result-card::after {
            position: absolute;
            z-index: 2;
            width: 18px;
            height: 18px;
            background: var(--orange);
            border-radius: 50%;
            content: "";
        }

        .result-card::before {
            top: 30px;
            right: 32px;
        }

        .result-card::after {
            top: 56px;
            right: 56px;
            width: 10px;
            height: 10px;
            background: var(--blue);
        }

        .image-frame {
            position: relative;
            display: grid;
            width: 100%;
            height: 100%;
            min-height: 506px;
            overflow: hidden;
            place-items: center;
            background: #eef6f8;
            border-radius: 20px;
        }

        #dogImage {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 280ms ease;
        }

        #dogImage.is-visible {
            opacity: 1;
        }

        .empty-state {
            max-width: 280px;
            padding: 32px;
            text-align: center;
        }

        .empty-state svg {
            width: 92px;
            height: 92px;
            margin-bottom: 18px;
            color: var(--blue);
        }

        .empty-state h2 {
            margin: 0 0 6px;
            font-family: "Fredoka", "Noto Sans TC", sans-serif;
            font-size: 1.45rem;
        }

        .empty-state p {
            margin: 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .status {
            position: absolute;
            right: 28px;
            bottom: 28px;
            left: 28px;
            z-index: 3;
            display: none;
            padding: 12px 16px;
            color: var(--navy);
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(25, 50, 74, 0.14);
            text-align: center;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .status.is-visible {
            display: block;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 700ms linear infinite;
        }

        button.is-loading .button-icon {
            display: none;
        }

        button.is-loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 820px) {
            main {
                grid-template-columns: 1fr;
                gap: 40px;
                padding-top: 40px;
            }

            .hero-copy {
                text-align: center;
            }

            .eyebrow {
                justify-content: center;
            }

            h1,
            .intro {
                margin-right: auto;
                margin-left: auto;
            }

            .search-panel {
                text-align: left;
            }

            .result-card {
                min-height: 480px;
            }

            .image-frame {
                min-height: 446px;
            }
        }

        @media (max-width: 520px) {
            .site-header,
            main {
                width: min(100% - 28px, 1120px);
            }

            .site-header {
                padding-top: 18px;
            }

            .api-label {
                display: none;
            }

            main {
                padding-top: 32px;
                padding-bottom: 48px;
            }

            h1 {
                font-size: clamp(2.5rem, 13vw, 3.5rem);
            }

            .search-panel {
                padding: 18px;
                border-radius: 20px;
                box-shadow: 5px 6px 0 var(--navy);
            }

            .search-controls {
                grid-template-columns: 1fr;
            }

            button {
                width: 100%;
            }

            .result-card {
                min-height: 420px;
                padding: 11px;
                border-radius: 24px;
                box-shadow: 5px 7px 0 var(--blue);
            }

            .image-frame {
                min-height: 394px;
                border-radius: 16px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="brand">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 13.5c-2.76 0-5 1.79-5 4 0 1.66 1.57 3 3.5 3 .55 0 1.07-.11 1.5-.3.43.19.95.3 1.5.3 1.93 0 3.5-1.34 3.5-3 0-2.21-2.24-4-5-4ZM6.5 12c1.38 0 2.5-1.34 2.5-3s-1.12-3-2.5-3S4 7.34 4 9s1.12 3 2.5 3Zm11 0c1.38 0 2.5-1.34 2.5-3s-1.12-3-2.5-3S15 7.34 15 9s1.12 3 2.5 3ZM11 7.5c1.38 0 2.5-1.34 2.5-3s-1.12-3-2.5-3-2.5 1.34-2.5 3 1.12 3 2.5 3Z"/>
                </svg>
            </span>
            <span>汪汪圖鑑</span>
        </div>
        <span class="api-label">DOG CEO API</span>
    </header>

    <main>
        <section class="hero-copy" aria-labelledby="page-title">
            <p class="eyebrow">今天想遇見誰？</p>
            <h1 id="page-title">發現你的下一張<span>可愛狗狗</span></h1>
            <p class="intro">選擇喜歡的犬種，按下搜尋，就能從世界各地的狗狗照片中隨機遇見一位新朋友。</p>

            <div class="search-panel">
                <label for="breed">選擇犬種</label>
                <div class="search-controls">
                    <select id="breed">
                        <option value="shiba">日本柴犬</option>
                        <option value="poodle">貴賓狗</option>
                        <option value="beagle">米格魯</option>
                    </select>
                    <button id="searchButton" type="button">
                        <svg class="button-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                            <circle cx="11" cy="11" r="7"></circle>
                            <path d="m20 20-4-4"></path>
                        </svg>
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="button-label">開始搜尋</span>
                    </button>
                </div>
                <p class="helper-text">每次搜尋都會隨機帶回一張新的狗狗照片。</p>
            </div>
        </section>

        <section class="result-card" aria-label="狗狗圖片搜尋結果">
            <div class="image-frame">
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 13.5c-2.76 0-5 1.79-5 4 0 1.66 1.57 3 3.5 3 .55 0 1.07-.11 1.5-.3.43.19.95.3 1.5.3 1.93 0 3.5-1.34 3.5-3 0-2.21-2.24-4-5-4ZM6.5 12c1.38 0 2.5-1.34 2.5-3s-1.12-3-2.5-3S4 7.34 4 9s1.12 3 2.5 3Zm11 0c1.38 0 2.5-1.34 2.5-3s-1.12-3-2.5-3S15 7.34 15 9s1.12 3 2.5 3ZM11 7.5c1.38 0 2.5-1.34 2.5-3s-1.12-3-2.5-3-2.5 1.34-2.5 3 1.12 3 2.5 3Z"/>
                    </svg>
                    <h2>準備好認識新朋友</h2>
                    <p>選好犬種後開始搜尋，狗狗照片會出現在這裡。</p>
                </div>
                <img id="dogImage" alt="" width="640" height="640">
                <p class="status" id="status" role="status" aria-live="polite"></p>
            </div>
        </section>
    </main>

    <script>
        const button = document.getElementById('searchButton');
        const buttonLabel = button.querySelector('.button-label');
        const dogImage = document.getElementById('dogImage');
        const breedSelect = document.getElementById('breed');
        const emptyState = document.getElementById('emptyState');
        const status = document.getElementById('status');

        function setLoading(isLoading) {
            button.disabled = isLoading;
            button.classList.toggle('is-loading', isLoading);
            buttonLabel.textContent = isLoading ? '搜尋中...' : '再找一張';
        }

        button.addEventListener('click', async () => {
            const breed = breedSelect.value;
            const breedName = breedSelect.options[breedSelect.selectedIndex].text;

            setLoading(true);
            status.textContent = '正在尋找可愛的狗狗...';
            status.classList.add('is-visible');

            try {
                const response = await fetch(`https://dog.ceo/api/breed/${breed}/images/random`);

                if (!response.ok) {
                    throw new Error('Request failed');
                }

                const data = await response.json();

                if (data.status !== 'success') {
                    throw new Error('Invalid response');
                }

                dogImage.onload = () => {
                    dogImage.classList.add('is-visible');
                    emptyState.hidden = true;
                    status.classList.remove('is-visible');
                    setLoading(false);
                };
                dogImage.onerror = () => {
                    status.textContent = '圖片載入失敗，請再試一次。';
                    setLoading(false);
                };
                dogImage.alt = `隨機搜尋到的${breedName}照片`;
                dogImage.src = data.message;
            } catch (error) {
                status.textContent = '目前無法取得圖片，請檢查網路後再試一次。';
                setLoading(false);
            }
        });
    </script>
</body>

</html>
